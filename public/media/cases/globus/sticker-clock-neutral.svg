    <path d="M7.1 7.9
             C8.4 6.1 10.2 5.2 12.5 5.2
             C14.6 5.2 16.4 6.1 17.7 7.4
             C15.9 7 14.3 6.9 12.8 7.2
             C10.7 7.5 8.9 8.3 7.4 9.4
             C6.9 9.1 6.8 8.5 7.1 7.9Z"
