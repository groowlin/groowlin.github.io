<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="2.75 2.75 18.5 18.5" fill="none">
  <defs>
    <linearGradient id="clockFill" x1="7" y1="4.5" x2="17.5" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C6CBD2"/>
      <stop offset="0.55" stop-color="#9EA5AE"/>
      <stop offset="1" stop-color="#7E858E"/>
    </linearGradient>
    <linearGradient id="clockGloss" x1="8" y1="5.5" x2="13.5" y2="12.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="handFill" x1="10.5" y1="8" x2="15.5" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEFF2"/>
    </linearGradient>
    <filter id="clockShadow" x="-25%" y="-25%" width="150%" height="150%">
