name: Content validation

on:
  pull_request:
    paths:
      - "content/**"
      - "public/media/**"
      - "lib/content/**"
      - "portfolio-structure.json"
      - "portoflio-structure.json"
      - "scripts/content-validate.mjs"
      - "scripts/content-validation.mjs"
      - "tests/content-validation.test.mjs"
      - ".github/workflows/content-validation.yml"
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "public/media/**"
      - "lib/content/**"
      - "portfolio-structure.json"
      - "portoflio-structure.json"
      - "scripts/content-validate.mjs"
      - "scripts/content-validation.mjs"
      - "tests/content-validation.test.mjs"
      - ".github/workflows/content-validation.yml"
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/content-validation.test.mjs
      - run: pnpm content:validate
