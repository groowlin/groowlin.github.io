name: Portfolio analytics snapshot

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Completed days to include"
        required: false
        default: "28"
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      YANDEX_METRICA_TOKEN: ${{ secrets.YANDEX_METRICA_TOKEN }}
      YANDEX_METRICA_COUNTER_ID: ${{ vars.YANDEX_METRICA_COUNTER_ID }}
      ANALYTICS_TRACKING_CONTRACT_VERSION: ${{ vars.ANALYTICS_TRACKING_CONTRACT_VERSION }}
      ANALYTICS_RELEASE_MARKER: ${{ vars.ANALYTICS_RELEASE_MARKER }}
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect aggregated snapshot
        shell: bash
        run: pnpm analytics:collect -- --days "${{ inputs.days || '28' }}"
      - name: Create report pull request
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- docs/analytics/reports/automated)" ]; then
            echo "No analytics changes"
            exit 0
          fi
          branch="automation/analytics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/analytics/reports/automated
          git commit -m "docs: add automated analytics snapshot"
          git push origin "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" --title "Analytics snapshot" --body "Automated aggregated Yandex Metrica snapshot. Review privacy and comparability notes before merging."
